name: Publish 0.4.6 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-046-once.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify clean release source
        shell: bash
        env:
          TARGET_SHA: 526df577d8852434aa11afafc7caa5aeff08c8d3
          RELEASE_TAG: v0.4.6
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git show "$TARGET_SHA:package.json" | grep -F '"version": "0.4.6"'
          git show "$TARGET_SHA:package-lock.json" | grep -F '"version": "0.4.6"'
          git show "$TARGET_SHA:CHANGELOG.md" | grep -F '## [0.4.6]'
          git show "$TARGET_SHA:.github/workflows/release.yml" | grep -Fq 'workflow_dispatch:'

      - name: Create stable release tag
        shell: bash
        env:
          TARGET_SHA: 526df577d8852434aa11afafc7caa5aeff08c8d3
          RELEASE_TAG: v0.4.6
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            CURRENT_SHA="$(git rev-list -n1 "$RELEASE_TAG")"
            test "$CURRENT_SHA" = "$TARGET_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "@gouno/ui 0.4.6"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Dispatch canonical npm release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v0.4.6 -f tag=v0.4.6
