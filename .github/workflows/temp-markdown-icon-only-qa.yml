name: Temp Markdown Icon-only QA

on:
  push:
    branches: [markdown-editor-icon-only-fallback]
    paths:
      - ".github/workflows/temp-markdown-icon-only-qa.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: markdown-editor-icon-only-fallback
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated Playwright runtime
        run: |
          PLAYWRIGHT_VERSION=1.55.0
          npm install --no-save --ignore-scripts @playwright/test@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
      - name: Verify final responsive contract
        shell: bash
        run: |
          cat > .tmp-markdown-icon-only-qa.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import assert from 'node:assert/strict';
          import { mkdir } from 'node:fs/promises';

          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 1100 } });
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));
          page.on('console', message => {
            if (message.type() !== 'error') return;
            const text = message.text();
            if (!text.startsWith('Failed to load resource: the server responded with a status of 404')) errors.push(text);
          });
          await page.goto('http://127.0.0.1:4174/?embedded=1&workspace=gouno-ui&brand=blog-admin#pattern-markdown-editor');
          await page.waitForSelector('[data-slot="markdown-editor"]');

          const editor = page.locator('[data-slot="markdown-editor"]').first();
          const toolbar = editor.locator('[data-slot="markdown-editor-toolbar"]');
          const actions = editor.locator('[data-slot="markdown-editor-actions"]');
          const modes = editor.locator('[data-slot="markdown-editor-mode-switcher"]');
          const setWidth = async width => {
            await editor.evaluate((el, w) => {
              el.style.width = `${w}px`;
              el.style.maxWidth = `${w}px`;
            }, width);
            await page.waitForTimeout(250);
          };
          const state = async () => ({
            density: await toolbar.getAttribute('data-adaptive-density'),
            wrap: await toolbar.getAttribute('data-adaptive-wrap'),
            primary: await editor.locator('[data-slot="markdown-editor-primary-command"]').count(),
            height: (await toolbar.boundingBox())?.height,
          });

          await setWidth(900);
          const broad = await state();
          assert.equal(broad.density, 'full');
          assert.equal(broad.wrap, 'false');
          assert.equal(broad.primary, 4);
          assert.ok((broad.height ?? 99) <= 52);

          for (const width of [700, 620, 580, 540, 520, 500, 480, 460]) {
            await setWidth(width);
            console.log(width, await state());
          }
          const compact = await state();
          assert.equal(compact.density, 'icon');
          assert.equal(compact.wrap, 'false');
          assert.equal(compact.primary, 0);
          assert.ok((compact.height ?? 99) <= 52);
          assert.equal(await actions.getAttribute('data-icon-only'), 'true');
          assert.equal(await modes.getAttribute('data-icon-only'), 'true');

          for (const name of ['AI 写作', '插图', '编辑', '预览']) {
            const button = editor.getByRole('button', { name });
            const box = await button.boundingBox();
            assert.ok(box && box.width >= 28 && box.width <= 36, `${name}: expected icon-only button, got ${box?.width}`);
            assert.equal((await button.textContent())?.trim(), '', `${name}: compact text should be absent`);
            const icon = button.locator('.btn__icon svg');
            const iconBox = await icon.boundingBox();
            assert.ok(await icon.isVisible(), `${name}: icon should be visible`);
            assert.ok(iconBox && iconBox.width >= 12 && iconBox.height >= 12, `${name}: icon should have visible geometry`);
          }

          await mkdir('/tmp/markdown-icon-only-evidence', { recursive: true });
          await editor.screenshot({ path: '/tmp/markdown-icon-only-evidence/icon-only-460.png' });

          await setWidth(300);
          const wrapped = await state();
          assert.equal(wrapped.density, 'icon');
          assert.equal(wrapped.wrap, 'true');
          await editor.screenshot({ path: '/tmp/markdown-icon-only-evidence/wrap-300.png' });

          await setWidth(900);
          const restored = await state();
          assert.equal(restored.density, 'full');
          assert.equal(restored.wrap, 'false');
          assert.equal(restored.primary, 4);
          assert.match(await editor.getByRole('button', { name: 'AI 写作' }).textContent(), /AI 写作/);
          assert.match(await editor.getByRole('button', { name: '插图' }).textContent(), /插图/);
          assert.deepEqual(errors, []);
          await browser.close();
          EOF
          npm run showcase:dev -- --host 127.0.0.1 --port 4174 >/tmp/showcase.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4174/ >/dev/null && break
            sleep 1
          done
          node .tmp-markdown-icon-only-qa.mjs
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: markdown-icon-only-qa-${{ github.run_id }}
          path: /tmp/markdown-icon-only-evidence
          if-no-files-found: error
