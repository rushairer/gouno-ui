name: Temp Fix Markdown Resize Hysteresis

on:
  push:
    branches: [markdown-editor-icon-only-fallback]
    paths:
      - ".github/workflows/temp-fix-markdown-resize-hysteresis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: markdown-editor-icon-only-fallback

      - name: Fix product action icon-only selectors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/patterns/markdown-editor.tsx")
          text = path.read_text()
          old = '''                  "[&_[data-slot=button]:has(>.btn__icon)]:size-8 [&_[data-slot=button]:has(>.btn__icon)]:px-0 [&_[data-slot=button]:has(>.btn__icon)>span:not(.btn__icon)]:sr-only",'''
          new = '''                  "[&_[data-slot=button]]:size-8 [&_[data-slot=button]]:px-0 [&_[data-slot=button]>span:not(.btn__icon)]:sr-only",'''
          if old not in text:
              raise SystemExit("compact product action selector target not found")
          path.write_text(text.replace(old, new, 1))

          docs_path = Path("showcase/demos/patterns/markdown-editor.tsx")
          docs = docs_path.read_text()
          marker = '''工具栏按自身容器宽度自适应：空间不足时低优先级内建格式命令会依次进入“更多格式”；继续变窄时，产品动作与视图切换收敛为仅图标；只有极窄容器才允许多行。'''
          replacement = '''工具栏按自身容器宽度自适应：空间不足时低优先级内建格式命令会依次进入“更多格式”；继续变窄时，带图标的产品动作与视图切换收敛为仅图标；只有极窄容器才允许多行。产品注入的 toolbarActions 应为紧凑态提供可识别图标与 aria-label。'''
          if marker not in docs:
              raise SystemExit("pattern adaptive copy target not found")
          docs_path.write_text(docs.replace(marker, replacement, 1))
          PY

      - name: Commit implementation
        shell: bash
        run: |
          git status --short
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/patterns/markdown-editor.tsx showcase/demos/patterns/markdown-editor.tsx
          git commit -m "fix(patterns): compact injected toolbar actions to icons"
          git push origin HEAD:markdown-editor-icon-only-fallback
