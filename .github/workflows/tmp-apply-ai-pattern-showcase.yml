name: Temporary apply AI pattern Showcase updates

on:
  push:
    branches:
      - feat/ai-pattern-showcase-post-metadata

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-pattern-showcase-post-metadata
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/tmp-apply-ai-pattern-showcase.py

      - name: Correct taxonomy interaction test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('tests/product-blog-admin-post-editor-metadata-ai.test.tsx')
          text = path.read_text()
          text = text.replace(
              '    render(<BlogAdminPostEditorDemo />);\n\n    fireEvent.click(screen.getByRole("button", { name: "AI 推荐分类与标签" }));',
              '    render(<BlogAdminPostEditorDemo initialRoute="new" />);\n    fireEvent.change(screen.getByLabelText("标题"), { target: { value: "Agent 工作流治理" } });\n\n    fireEvent.click(screen.getByRole("button", { name: "AI 推荐分类与标签" }));',
              1,
          )
          text = text.replace(
              '    expect((screen.getByLabelText("分类") as HTMLSelectElement).value).toBe("1");',
              '    expect(screen.getByRole("combobox", { name: "分类" }).textContent).toContain("AI");',
              1,
          )
          path.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused tests
        run: npx vitest run --environment jsdom tests/pattern-ai-suggestions.test.tsx tests/pattern-ai-suggestion-showcase.test.ts tests/product-blog-admin-post-editor-metadata-ai.test.tsx

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase docs scripts/package-check.mjs tests
          git commit -m "feat: complete AI Pattern demos and post metadata UX"
          git push origin HEAD:feat/ai-pattern-showcase-post-metadata
