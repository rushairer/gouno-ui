name: Temporary apply AI pattern Showcase updates

on:
  push:
    branches:
      - feat/ai-pattern-showcase-post-metadata

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-pattern-showcase-post-metadata
          fetch-depth: 0

      - name: Apply product and Showcase updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(path, old, new):
              file = root / path
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:120]!r}')
              file.write_text(text.replace(old, new, 1))

          def write(path, content):
              file = root / path
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(content)

