name: Finalize Core 6A governance

on:
  push:
    branches:
      - docs/core-general-layout-6a-governance
    paths:
      - .github/workflows/finalize-core-6a-governance.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/core-general-layout-6a-governance
      - name: Append verified governance records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('docs/api-conformance.md')
          text = api.read_text()
          if 'API-031' not in text:
              row = '| API-031 | Core `Icon` / `Kbd` / `Flex` / `Separator` 完成 reviewed 100 封板：Icon 使用标准 SVG/ref/ARIA，未命名时 decorative、命名后采用 img 语义，并支持 `small/middle/large | number`、spin/rotate；Kbd 保持原生 `<kbd>` ground-level 语义；Flex 对齐 CSS direction/align/justify/wrap/flex 与 token/number gap 且不增加 child wrapper；Separator 统一 horizontal/vertical、decorative/semantic、solid/dashed/dotted、horizontal content/titlePlacement 与 semantic slots。不得恢复 `Icon.label` 或为这些基础组件注入产品文案/业务语义。 | same-source Showcase/API docs + `core-general-layout-6a` focused tests + main run 291 / PD-055 |'
              marker = '\n\n## 当前破坏式迁移说明'
              if marker not in text:
                  raise SystemExit('api conformance marker missing')
              text = text.replace(marker, '\n' + row + marker, 1)
              api.write_text(text)

          register = Path('docs/abstraction-register.md')
          text = register.read_text()
          if '### PD-055' not in text:
              text = text.rstrip() + '''\n\n### PD-055 — General/Layout 6A reaches reviewed 100 without expanding product semantics\n\n- **Status:** accepted / Core hardening\n- **Owner:** Core / General + Layout families\n- **Evidence:** Existing Icon, Kbd, Flex and Separator are established generic UI-library families; Ant Design 6.x confirms the continuing value of explicit icon semantics, flex layout and Divider-like separators, while Gouno binding rules require standard ARIA, `small/middle/large` sizing, semantic elevation and single-write-path APIs. Main run 291 passed typecheck, 554 tests, package build, Showcase build, npm pack and Pages publication.\n- **Decision:** Certify `core-icon`, `core-kbd`, `core-flex` and `core-separator` at reviewed 100 for their deliberate Gouno scope. `Icon.label` is not retained as a second accessible-name path; standard `aria-label` / `aria-labelledby` own naming. Kbd remains a native ground-level element. Flex exposes direct CSS semantics without child wrappers or redundant vertical aliases. Separator owns line/content composition and standard separator semantics but not surrounding spacing or product copy.\n- **Consequence:** Core reviewed completion is still not globally 100; remaining families continue through the same API + behavior + a11y + same-source Demo/code + tests gate. No established Core family was removed to improve the score.\n'''
              register.write_text(text)

          migration = Path('docs/migration.md')
          text = migration.read_text()
          if '## General/Layout 6A canonicalization' not in text:
              section = '''## General/Layout 6A canonicalization\n\nPost-`0.2.0` Core hardening makes the existing General/Layout contracts explicit. The only compatibility-sensitive rename in this batch is Icon accessible naming:\n\n```text\nIcon label="..." -> Icon aria-label="..."\n```\n\n`aria-labelledby` is also supported when visible caller-owned text already names the icon. Unnamed icons are decorative by default. Flex and Separator changes are additive within their established component families; Kbd remains a native semantic wrapper. This work is unreleased after `v0.2.0` and must be consumed through a future package version rather than re-vendoring a different artifact under `0.2.0`.\n\n'''
              marker = '## Compatibility assessment'
              if marker not in text:
                  raise SystemExit('migration marker missing')
              text = text.replace(marker, section + marker, 1)
              migration.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if 'General/Layout 6A' not in text:
              marker = '## [Unreleased]\n'
              block = '''## [Unreleased]\n\n### Changed\n\n- General/Layout 6A: hardened Core `Icon`, `Kbd`, `Flex` and `Separator` with ref-safe native contracts, standard ARIA, mature layout/line capabilities, semantic slots, same-source Showcase examples and focused certification tests.\n- Core reviewed-completion continues independently from runtime-family coverage; no established Core family is removed merely to raise completion percentages.\n\n### Breaking\n\n- `Icon.label` is replaced by the standard `aria-label` / `aria-labelledby` accessible-name path.\n'''
              if marker not in text:
                  raise SystemExit('changelog marker missing')
              text = text.replace(marker, block, 1)
              changelog.write_text(text)
          PY
      - name: Commit governance and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/finalize-core-6a-governance.yml
          git add CHANGELOG.md docs/api-conformance.md docs/abstraction-register.md docs/migration.md
          git commit -m "docs(core): record General Layout 6A certification"
          git push origin HEAD:docs/core-general-layout-6a-governance
