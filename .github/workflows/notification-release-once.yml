name: Dispatch Notification 0.4.1 Release Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/notification-release-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-release:
    if: "${{ github.repository == 'rushairer/gouno-ui' && github.event.head_commit.message == 'chore(release): dispatch notification 0.4.1' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Verify release tag exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/rushairer/gouno-ui/git/ref/tags/v0.4.1 >/dev/null

      - name: Dispatch release from the release tag ref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo rushairer/gouno-ui --ref v0.4.1 -f tag=v0.4.1
