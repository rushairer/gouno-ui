name: Temporary editor AI suggestion UX visual verification

on:
  push:
    branches:
      - feat/editor-ai-suggestion-ux
    paths:
      - .github/workflows/editor-ai-suggestion-ux-visual.yml

permissions:
  contents: write

jobs:
  visual:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/editor-ai-suggestion-ux

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          PLAYWRIGHT_VERSION=1.55.0
          npm install --no-save --ignore-scripts @playwright/test@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium

      - name: Regenerate canonical PostEditor golden
        run: npx playwright test --config=showcase/e2e/canonical-visual-golden.config.mjs --update-snapshots

      - name: Run focused PostEditor/PageEditor browser QA
        run: |
          mkdir -p qa/editor-ai-ux
          cat > showcase/e2e/editor-ai-ux-qa.pw.mjs <<'EOF'
          import { expect, test } from "@playwright/test";

          const desktop = { width: 1440, height: 1000 };

          async function prepare(page, fixture) {
            await page.setViewportSize(desktop);
            await page.addInitScript(() => localStorage.setItem("gouno-ui-showcase:theme", "light"));
            await page.goto(`/?embedded=1&workspace=blog-admin&brand=blog-admin#${fixture}`, { waitUntil: "networkidle" });
            await expect(page.locator("html")).toHaveAttribute("data-theme", "light");
            await expect(page.locator("html")).toHaveAttribute("data-brand", "blog-admin");
            await page.evaluate(async () => { await document.fonts.ready; });
          }

          test("PostEditor outline and field AI selection are visually bounded", async ({ page }) => {
            await prepare(page, "blog-admin-post-editor");

            const navigator = page.locator('[data-slot="document-editor-navigator"]');
            const outlineItem = page.getByRole("button", { name: /跳转到 为什么现在要谈可观测性/ });
            const truncated = outlineItem.locator(".truncate");
            await expect(navigator).toBeVisible();
            await expect(truncated).toBeVisible();
            const styles = await truncated.evaluate((node) => {
              const style = getComputedStyle(node);
              return { whiteSpace: style.whiteSpace, overflow: style.overflow, textOverflow: style.textOverflow };
            });
            expect(styles.whiteSpace).toBe("nowrap");
            expect(styles.overflow).toBe("hidden");
            expect(styles.textOverflow).toBe("ellipsis");
            const [navBox, itemBox] = await Promise.all([navigator.boundingBox(), outlineItem.boundingBox()]);
            expect(navBox).toBeTruthy();
            expect(itemBox).toBeTruthy();
            expect(itemBox.x + itemBox.width).toBeLessThanOrEqual(navBox.x + navBox.width + 1);

            await page.getByRole("button", { name: "AI 生成标题候选" }).click();
            const picker = page.getByLabel("标题 AI 建议");
            await expect(picker).toBeVisible();
            await expect(page.getByRole("radiogroup", { name: "标题候选" })).toBeVisible();
            await expect(page.getByRole("radio")).toHaveCount(2);
            await expect(page.getByRole("button", { name: "使用所选" })).toHaveCount(1);
            await page.screenshot({ path: "qa/editor-ai-ux/post-editor-title-picker.png", fullPage: true, animations: "disabled" });
          });

          test("PageEditor uses one section-scoped Path/SEO AI review", async ({ page }) => {
            await prepare(page, "blog-admin-page-editor");

            await expect(page.getByRole("button", { name: "AI 生成 Slug 候选" })).toHaveCount(0);
            const sectionAction = page.getByRole("button", { name: "AI 优化路径与 SEO" });
            await expect(sectionAction).toBeVisible();
            await sectionAction.click();
            const review = page.getByLabel("AI 路径与 SEO 建议");
            await expect(review).toBeVisible();
            await expect(page.getByRole("group", { name: "路径与 SEO 建议" })).toBeVisible();
            await expect(page.getByRole("checkbox", { name: /应用 .* 建议/ })).toHaveCount(3);
            await expect(page.getByRole("button", { name: "应用 3 项建议" })).toHaveCount(1);
            await page.screenshot({ path: "qa/editor-ai-ux/page-editor-seo-review.png", fullPage: true, animations: "disabled" });
          });
          EOF

          cat > showcase/e2e/editor-ai-ux-qa.config.mjs <<'EOF'
          import { defineConfig } from "@playwright/test";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";
          const testDir = dirname(fileURLToPath(import.meta.url));
          const root = resolve(testDir, "../..");
          export default defineConfig({
            testDir,
            testMatch: "editor-ai-ux-qa.pw.mjs",
            timeout: 45_000,
            fullyParallel: false,
            workers: 1,
            reporter: [["list"]],
            use: {
              baseURL: "http://127.0.0.1:4174",
              browserName: "chromium",
              locale: "zh-CN",
              timezoneId: "Asia/Shanghai",
              colorScheme: "light",
              deviceScaleFactor: 1,
            },
            webServer: {
              command: "npm run showcase:dev -- --host 127.0.0.1 --port 4174",
              cwd: root,
              url: "http://127.0.0.1:4174",
              reuseExistingServer: false,
              timeout: 120_000,
            },
          });
          EOF

          npx playwright test --config=showcase/e2e/editor-ai-ux-qa.config.mjs
          rm showcase/e2e/editor-ai-ux-qa.pw.mjs showcase/e2e/editor-ai-ux-qa.config.mjs
          git restore package.json package-lock.json

      - name: Commit golden and temporary visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/e2e/canonical-visual-golden.pw.mjs-snapshots qa/editor-ai-ux
          git commit -m "test(blog-admin): refresh editor AI UX visual evidence"
          git push origin HEAD:feat/editor-ai-suggestion-ux
