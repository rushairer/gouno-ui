name: Seal Empty and Result source trust

on:
  push:
    branches:
      - showcase/empty-result-source-trust-20260909

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove legacy Empty and Result docs and certify progress
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          feedback_path = Path("showcase/demos/core/feedback.tsx")
          feedback = feedback_path.read_text()
          feedback, removed = re.subn(
              r'  empty: \{.*?\n  spin: \{',
              '  spin: {',
              feedback,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit(f"expected one Empty/Result document region, removed {removed}")
          feedback = feedback.replace("  Empty,\n", "", 1).replace("  Result,\n", "", 1)
          feedback_path.write_text(feedback)

          progress_path = Path("showcase/component-progress.ts")
          progress = progress_path.read_text()
          marker = '  "core-progress",\n'
          insertion = '  "core-empty",\n  "core-result",\n  "core-progress",\n'
          if marker not in progress:
              raise SystemExit("component progress marker missing")
          progress_path.write_text(progress.replace(marker, insertion, 1))
          PY

      - name: Verify sealed family
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
          npm run showcase:build

      - name: Persist clean branch commit
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm .github/workflows/seal-empty-result.yml
          git add showcase tests
          git commit -m "test(core): certify Empty and Result source trust"
          git push origin HEAD
