name: Temp Fix Markdown Icon Fallback

on:
  push:
    branches: [markdown-editor-icon-only-fallback]
    paths:
      - ".github/workflows/temp-fix-markdown-icon-fallback.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: markdown-editor-icon-only-fallback

      - name: Apply adaptive icon-only fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing replacement target: {label}")
              return text.replace(old, new, 1)

          path = Path("src/patterns/markdown-editor.tsx")
          text = path.read_text()

          text = replace_once(text,
          '''  Bold,\n  ChevronDown,\n  Code2,\n  Italic,''',
          '''  Bold,\n  ChevronDown,\n  Code2,\n  Columns2,\n  Eye,\n  Italic,''',
          "mode icon imports 1")
          text = replace_once(text,
          '''  Minus,\n  MoreHorizontal,\n  Quote,''',
          '''  Minus,\n  MoreHorizontal,\n  Pencil,\n  Quote,''',
          "mode icon imports 2")

          text = replace_once(text,
          '''const modeLabels: Record<MarkdownEditorMode, string> = {\n  edit: "编辑",\n  split: "分屏",\n  preview: "预览",\n};''',
          '''const modeLabels: Record<MarkdownEditorMode, string> = {\n  edit: "编辑",\n  split: "分屏",\n  preview: "预览",\n};\n\nconst modeIcons: Record<MarkdownEditorMode, ReactNode> = {\n  edit: <Pencil />,\n  split: <Columns2 />,\n  preview: <Eye />,\n};''',
          "mode icon map")

          text = replace_once(text,
          '''    const [visiblePrimaryCount, setVisiblePrimaryCount] = useState(primaryCommands.length);\n    const [allowToolbarWrap, setAllowToolbarWrap] = useState(false);''',
          '''    const [visiblePrimaryCount, setVisiblePrimaryCount] = useState(primaryCommands.length);\n    const [compactFixedActions, setCompactFixedActions] = useState(false);\n    const [allowToolbarWrap, setAllowToolbarWrap] = useState(false);''',
          "adaptive density state")

          text = replace_once(text,
          '''    const toolbarRef = useRef<HTMLDivElement>(null);\n    const toolbarActionsRef = useRef<HTMLDivElement>(null);\n    const modeSwitcherRef = useRef<HTMLDivElement>(null);\n    const headingTriggerRef = useRef<HTMLButtonElement>(null);''',
          '''    const toolbarRef = useRef<HTMLDivElement>(null);\n    const headingTriggerRef = useRef<HTMLButtonElement>(null);''',
          "remove feedback observer refs")

          old_effect = '''    // Compact only the built-in primary formatting actions. Product-injected actions and\n    // the edit/split/preview switch stay stable; if even the compacted toolbar cannot fit,\n    // normal wrapping remains the final fallback for extremely narrow containers.\n    useLayoutEffect(() => {\n      if (!showAuthoringTools || allowToolbarWrap) return;\n      const toolbar = toolbarRef.current;\n      if (!toolbar) return;\n      if (toolbar.scrollWidth <= toolbar.clientWidth + 1) return;\n\n      if (visiblePrimaryCount > 0) {\n        setVisiblePrimaryCount((count) => Math.max(0, count - 1));\n        return;\n      }\n\n      setAllowToolbarWrap(true);\n    }, [allowToolbarWrap, showAuthoringTools, toolbarLayoutEpoch, visiblePrimaryCount]);'''
          new_effect = '''    // Three-stage degradation: built-in format commands collapse into More first; then\n    // product actions and the view switch become icon-only; wrapping is reserved for the\n    // final fallback when the compact toolbar still cannot fit.\n    useLayoutEffect(() => {\n      if (!showAuthoringTools || allowToolbarWrap) return;\n      const toolbar = toolbarRef.current;\n      if (!toolbar) return;\n      if (toolbar.scrollWidth <= toolbar.clientWidth + 1) return;\n\n      if (visiblePrimaryCount > 0) {\n        setVisiblePrimaryCount((count) => Math.max(0, count - 1));\n        return;\n      }\n\n      if (!compactFixedActions) {\n        setCompactFixedActions(true);\n        return;\n      }\n\n      setAllowToolbarWrap(true);\n    }, [\n      allowToolbarWrap,\n      compactFixedActions,\n      showAuthoringTools,\n      toolbarLayoutEpoch,\n      visiblePrimaryCount,\n    ]);'''
          text = replace_once(text, old_effect, new_effect, "three-stage adaptive effect")

          old_observer = '''    // Re-expand first, then compact against the new geometry whenever the container or one\n    // of the fixed toolbar regions changes width. Width-only comparison avoids reacting to\n    // the height change caused by the final wrapping fallback.\n    useLayoutEffect(() => {\n      const toolbar = toolbarRef.current;\n      if (!toolbar || typeof ResizeObserver === "undefined") return;\n\n      const observed: Element[] = [toolbar];\n      if (toolbarActionsRef.current) observed.push(toolbarActionsRef.current);\n      if (modeSwitcherRef.current) observed.push(modeSwitcherRef.current);\n      if (headingTriggerRef.current) observed.push(headingTriggerRef.current);\n      const widths = new Map<Element, number>();\n      observed.forEach((element) => widths.set(element, element.getBoundingClientRect().width));\n\n      const observer = new ResizeObserver((entries) => {\n        let widthChanged = false;\n        entries.forEach((entry) => {\n          const previous = widths.get(entry.target);\n          const next = entry.contentRect.width;\n          widths.set(entry.target, next);\n          if (previous !== undefined && Math.abs(previous - next) > 0.5) widthChanged = true;\n        });\n        if (!widthChanged) return;\n\n        setAllowToolbarWrap(false);\n        setVisiblePrimaryCount(primaryCommands.length);\n        setToolbarLayoutEpoch((epoch) => epoch + 1);\n      });\n\n      observed.forEach((element) => observer.observe(element));\n      return () => observer.disconnect();\n    }, [showAuthoringTools]);'''
          new_observer = '''    // Re-expand first whenever the editor container itself changes width, then rerun the\n    // degradation sequence against the new geometry. Only observing the toolbar avoids a\n    // feedback loop when fixed actions intentionally shrink into icon-only mode.\n    useLayoutEffect(() => {\n      const toolbar = toolbarRef.current;\n      if (!toolbar || typeof ResizeObserver === "undefined") return;\n\n      let previousWidth = toolbar.getBoundingClientRect().width;\n      const observer = new ResizeObserver((entries) => {\n        const entry = entries.find((candidate) => candidate.target === toolbar);\n        if (!entry) return;\n        const nextWidth = entry.contentRect.width;\n        if (Math.abs(previousWidth - nextWidth) <= 0.5) return;\n        previousWidth = nextWidth;\n\n        setAllowToolbarWrap(false);\n        setCompactFixedActions(false);\n        setVisiblePrimaryCount(primaryCommands.length);\n        setToolbarLayoutEpoch((epoch) => epoch + 1);\n      });\n\n      observer.observe(toolbar);\n      return () => observer.disconnect();\n    }, [showAuthoringTools]);'''
          text = replace_once(text, old_observer, new_observer, "resize observer")

          text = replace_once(text,
          '''      setAllowToolbarWrap(false);\n      setVisiblePrimaryCount(primaryCommands.length);''',
          '''      setAllowToolbarWrap(false);\n      setCompactFixedActions(false);\n      setVisiblePrimaryCount(primaryCommands.length);''',
          "authoring mode reset")

          text = replace_once(text,
          '''          data-slot="markdown-editor-toolbar"\n          data-adaptive-wrap={allowToolbarWrap ? "true" : "false"}''',
          '''          data-slot="markdown-editor-toolbar"\n          data-adaptive-density={compactFixedActions ? "icon" : "full"}\n          data-adaptive-wrap={allowToolbarWrap ? "true" : "false"}''',
          "toolbar density marker")

          text = replace_once(text,
          '''          {toolbarActions && showAuthoringTools ? (\n            <div\n              ref={toolbarActionsRef}\n              className="ml-1 flex shrink-0 items-center gap-1 border-l pl-2"\n              data-slot="markdown-editor-actions"\n            >''',
          '''          {toolbarActions && showAuthoringTools ? (\n            <div\n              className={cn(\n                "ml-1 flex shrink-0 items-center gap-1 border-l pl-2",\n                compactFixedActions &&\n                  "[&_[data-slot=button]:has(>.btn__icon)]:size-8 [&_[data-slot=button]:has(>.btn__icon)]:px-0 [&_[data-slot=button]:has(>.btn__icon)>span:not(.btn__icon)]:sr-only",\n              )}\n              data-slot="markdown-editor-actions"\n              data-icon-only={compactFixedActions ? "true" : "false"}\n            >''',
          "product actions icon mode")

          text = replace_once(text,
          '''          <div\n            ref={modeSwitcherRef}\n            className="ml-auto flex shrink-0 items-center gap-0.5 rounded-md bg-muted/60 p-0.5"\n            aria-label="编辑器视图"\n            data-slot="markdown-editor-mode-switcher"\n          >''',
          '''          <div\n            className="ml-auto flex shrink-0 items-center gap-0.5 rounded-md bg-muted/60 p-0.5"\n            aria-label="编辑器视图"\n            data-slot="markdown-editor-mode-switcher"\n            data-icon-only={compactFixedActions ? "true" : "false"}\n          >''',
          "mode switch density marker")

          old_mode_button = '''              <Button\n                key={nextMode}\n                type="button"\n                size="small"\n                variant={activeMode === nextMode ? "solid" : "text"}\n                color={activeMode === nextMode ? "primary" : undefined}\n                className={nextMode === "split" ? "hidden md:inline-flex" : undefined}\n                aria-pressed={activeMode === nextMode}\n                onClick={() => changeMode(nextMode)}\n              >\n                {modeLabels[nextMode]}\n              </Button>'''
          new_mode_button = '''              <Button\n                key={nextMode}\n                type="button"\n                size="small"\n                variant={activeMode === nextMode ? "solid" : "text"}\n                color={activeMode === nextMode ? "primary" : undefined}\n                icon={compactFixedActions ? modeIcons[nextMode] : undefined}\n                className={cn(\n                  nextMode === "split" && "hidden md:inline-flex",\n                  compactFixedActions && "size-8 px-0",\n                )}\n                aria-label={modeLabels[nextMode]}\n                title={compactFixedActions ? modeLabels[nextMode] : undefined}\n                aria-pressed={activeMode === nextMode}\n                onClick={() => changeMode(nextMode)}\n              >\n                {compactFixedActions ? null : modeLabels[nextMode]}\n              </Button>'''
          text = replace_once(text, old_mode_button, new_mode_button, "mode icon-only buttons")
          path.write_text(text)

          test_path = Path("tests/pattern-markdown-editor-adaptive-toolbar.test.tsx")
          test = test_path.read_text()
          test = replace_once(test,
          '''  fixedWidth = 320,\n) {''',
          '''  fixedWidth = 320,\n  iconOnlyFixedWidth = 220,\n) {''',
          "test geometry signature")
          test = replace_once(test,
          '''      const visiblePrimary = root.querySelectorAll('[data-slot="markdown-editor-primary-command"]').length;\n      return fixedWidth + visiblePrimary * 48;''',
          '''      const visiblePrimary = root.querySelectorAll('[data-slot="markdown-editor-primary-command"]').length;\n      const currentFixedWidth =\n        toolbar.getAttribute("data-adaptive-density") === "icon" ? iconOnlyFixedWidth : fixedWidth;\n      return currentFixedWidth + visiblePrimary * 48;''',
          "test density geometry")

          marker = '  it("uses wrapping only as the final fallback after every primary command has moved into More"'
          index = test.find(marker)
          if index < 0:
              raise SystemExit("missing replacement target: final fallback tests")
          prefix = test[:index]
          replacement = '''  it("switches product actions and view modes to icon density before wrapping", async () => {\n    const resize = installResizeObserverMock();\n    const { container } = render(\n      <MarkdownEditor\n        value="body"\n        onChange={() => undefined}\n        toolbarActions={<button type="button">产品动作</button>}\n        textareaAriaLabel="窄 Markdown"\n      />,\n    );\n\n    const toolbar = container.querySelector('[data-slot="markdown-editor-toolbar"]') as HTMLElement;\n    const width = 280;\n    installToolbarGeometry(toolbar, container, () => width, 320, 220);\n\n    await act(async () => {\n      resize.notify(toolbar, width);\n      await Promise.resolve();\n    });\n\n    await waitFor(() => {\n      expect(container.querySelectorAll('[data-slot="markdown-editor-primary-command"]')).toHaveLength(0);\n      expect(toolbar.getAttribute("data-adaptive-density")).toBe("icon");\n      expect(toolbar.getAttribute("data-adaptive-wrap")).toBe("false");\n    });\n\n    const modeSwitcher = container.querySelector('[data-slot="markdown-editor-mode-switcher"]') as HTMLElement;\n    expect(modeSwitcher.getAttribute("data-icon-only")).toBe("true");\n    expect(screen.getByRole("button", { name: "编辑" }).textContent).toBe("");\n    expect(screen.getByRole("button", { name: "预览" }).textContent).toBe("");\n  });\n\n  it("uses wrapping only after icon-only fixed actions still cannot fit", async () => {\n    const resize = installResizeObserverMock();\n    const { container } = render(\n      <MarkdownEditor\n        value="body"\n        onChange={() => undefined}\n        toolbarActions={<button type="button">产品动作</button>}\n        textareaAriaLabel="极窄 Markdown"\n      />,\n    );\n\n    const toolbar = container.querySelector('[data-slot="markdown-editor-toolbar"]') as HTMLElement;\n    const width = 180;\n    installToolbarGeometry(toolbar, container, () => width, 320, 220);\n\n    await act(async () => {\n      resize.notify(toolbar, width);\n      await Promise.resolve();\n    });\n\n    await waitFor(() => {\n      expect(container.querySelectorAll('[data-slot="markdown-editor-primary-command"]')).toHaveLength(0);\n      expect(toolbar.getAttribute("data-adaptive-density")).toBe("icon");\n      expect(toolbar.getAttribute("data-adaptive-wrap")).toBe("true");\n    });\n\n    fireEvent.pointerDown(screen.getByRole("button", { name: "更多格式" }), {\n      button: 0,\n      ctrlKey: false,\n    });\n    expect(screen.getByRole("menuitem", { name: "加粗" })).toBeTruthy();\n    expect(screen.getByRole("menuitem", { name: "斜体" })).toBeTruthy();\n    expect(screen.getByRole("menuitem", { name: "插入链接" })).toBeTruthy();\n    expect(screen.getByRole("menuitem", { name: "行内代码" })).toBeTruthy();\n  });\n});\n'''
          test_path.write_text(prefix + replacement)

          docs_path = Path("showcase/demos/patterns/markdown-editor.tsx")
          docs = docs_path.read_text()
          docs = replace_once(docs,
          '''工具栏按自身容器宽度自适应：空间不足时低优先级内建格式命令会依次进入“更多格式”，优先保持产品动作与视图切换稳定可见。''',
          '''工具栏按自身容器宽度自适应：空间不足时低优先级内建格式命令会依次进入“更多格式”；继续变窄时，产品动作与视图切换收敛为仅图标；只有极窄容器才允许多行。''',
          "pattern overview copy")
          docs = replace_once(docs,
          '''缩窄 Demo 容器时，行内代码、链接等较低优先级默认命令会自动收进“更多格式”，极窄宽度才退回多行布局。''',
          '''缩窄 Demo 容器时，行内代码、链接等较低优先级默认命令会自动收进“更多格式”；继续变窄后，AI 写作 / 插图与编辑 / 分屏 / 预览会切换为 icon-only，仍放不下时才退回多行布局。''',
          "pattern demo copy")
          docs_path.write_text(docs)
          PY

      - name: Commit implementation
        shell: bash
        run: |
          git status --short
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add src/patterns/markdown-editor.tsx tests/pattern-markdown-editor-adaptive-toolbar.test.tsx showcase/demos/patterns/markdown-editor.tsx
          git commit -m "fix(patterns): restore Markdown toolbar icon-only fallback"
          git push origin HEAD:markdown-editor-icon-only-fallback
