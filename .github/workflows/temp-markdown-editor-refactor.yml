name: Temporary MarkdownEditor Refactor

on:
  push:
    branches: [markdown-editor-showcase-and-interactions]
    paths:
      - scripts/refactor-markdown-editor-showcase.mjs
      - .github/workflows/temp-markdown-editor-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: markdown-editor-showcase-and-interactions

      - name: Apply deterministic refactor
        run: node scripts/refactor-markdown-editor-showcase.mjs

      - name: Commit refactor
        run: |
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add showcase tests
          git diff --cached --quiet && exit 0
          git commit -m "refactor(showcase): present markdown editor assistants as modals"
          git push origin HEAD:markdown-editor-showcase-and-interactions
