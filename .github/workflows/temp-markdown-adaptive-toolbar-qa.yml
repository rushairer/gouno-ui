name: Temp Markdown Adaptive Toolbar QA

on:
  push:
    branches: [markdown-editor-adaptive-toolbar]
    paths:
      - "src/patterns/markdown-editor.tsx"
      - "showcase/demos/patterns/**"
      - ".github/workflows/temp-markdown-adaptive-toolbar-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install isolated Playwright runtime
        run: |
          PLAYWRIGHT_VERSION=1.55.0
          npm install --no-save --ignore-scripts @playwright/test@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium

      - name: Run responsive toolbar QA
        run: |
          npm run showcase:dev -- --host 127.0.0.1 --port 4174 > /tmp/gouno-showcase.log 2>&1 &
          SHOWCASE_PID=$!
          trap 'kill $SHOWCASE_PID || true; rm -f .tmp-markdown-toolbar-qa.mjs' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p /tmp/markdown-toolbar-qa
          cat > .tmp-markdown-toolbar-qa.mjs <<'EOF'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, colorScheme: 'light', locale: 'zh-CN' });
          const consoleErrors = [];
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          await page.goto('http://127.0.0.1:4174/?embedded=1&workspace=gouno-ui#pattern-markdown-editor');
          await page.waitForLoadState('networkidle');
          const editor = page.locator('[data-slot="markdown-editor"]').first();
          await editor.waitFor({ state: 'visible' });

          async function setWidth(width, label) {
            await editor.evaluate((element, nextWidth) => {
              element.style.width = `${nextWidth}px`;
              element.style.maxWidth = `${nextWidth}px`;
            }, width);
            await page.waitForTimeout(250);
            const toolbar = editor.locator('[data-slot="markdown-editor-toolbar"]');
            const primary = editor.locator('[data-slot="markdown-editor-primary-command"]');
            const actions = editor.locator('[data-slot="markdown-editor-actions"]');
            const modes = editor.locator('[data-slot="markdown-editor-mode-switcher"]');
            const info = {
              label,
              width,
              visiblePrimaryCount: await primary.count(),
              wrap: await toolbar.getAttribute('data-adaptive-wrap'),
              toolbarScrollWidth: await toolbar.evaluate((element) => element.scrollWidth),
              toolbarClientWidth: await toolbar.evaluate((element) => element.clientWidth),
              actionsVisible: await actions.isVisible(),
              modesVisible: await modes.isVisible(),
            };
            fs.writeFileSync(`/tmp/markdown-toolbar-qa/${label}.json`, JSON.stringify(info, null, 2));
            await editor.screenshot({ path: `/tmp/markdown-toolbar-qa/${label}.png` });
            return info;
          }

          const wide = await setWidth(900, 'wide');
          if (wide.visiblePrimaryCount !== 4 || wide.wrap !== 'false') throw new Error(`wide toolbar unexpected: ${JSON.stringify(wide)}`);

          const medium = await setWidth(650, 'medium');
          if (!(medium.visiblePrimaryCount < 4 && medium.visiblePrimaryCount >= 1)) throw new Error(`medium toolbar did not compact progressively: ${JSON.stringify(medium)}`);
          if (medium.wrap !== 'false' || !medium.actionsVisible || !medium.modesVisible) throw new Error(`medium fixed regions unstable: ${JSON.stringify(medium)}`);

          const narrow = await setWidth(500, 'narrow');
          if (!(narrow.visiblePrimaryCount <= medium.visiblePrimaryCount)) throw new Error(`narrow toolbar expanded unexpectedly: ${JSON.stringify(narrow)}`);
          if (narrow.wrap !== 'false' || !narrow.actionsVisible || !narrow.modesVisible) throw new Error(`narrow toolbar should compact before wrapping: ${JSON.stringify(narrow)}`);

          const textarea = page.getByLabel('MarkdownEditor Demo 正文');
          await textarea.focus();
          await textarea.evaluate((element) => element.setSelectionRange(3, 17));
          await editor.getByRole('button', { name: '更多格式' }).click();
          const hiddenCode = page.getByRole('menuitem', { name: '行内代码' });
          if (!(await hiddenCode.isVisible())) throw new Error('collapsed 行内代码 missing from 更多格式');
          await page.keyboard.press('Escape');

          const extreme = await setWidth(360, 'extreme');
          if (extreme.visiblePrimaryCount !== 0 || extreme.wrap !== 'true') throw new Error(`extreme toolbar should use final wrap fallback: ${JSON.stringify(extreme)}`);

          const relevantErrors = consoleErrors.filter((line) => !line.includes('404'));
          fs.writeFileSync('/tmp/markdown-toolbar-qa/console-errors.json', JSON.stringify(relevantErrors, null, 2));
          if (relevantErrors.length) throw new Error(`console errors: ${relevantErrors.join('\n')}`);
          await browser.close();
          EOF
          node .tmp-markdown-toolbar-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: markdown-adaptive-toolbar-qa-${{ github.run_id }}
          path: /tmp/markdown-toolbar-qa
          if-no-files-found: error
          retention-days: 7
