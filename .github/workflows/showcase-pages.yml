name: Publish Showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Showcase microcopy
        run: npm run lint:microcopy

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --run

      - name: Build package
        run: npm run build

      - name: Build Showcase
        run: npm run showcase:build

      - name: Verify package surface
        run: npm run package:check

      - name: Pack verified package
        run: |
          mkdir -p package-artifacts
          npm pack --pack-destination package-artifacts --ignore-scripts

      - name: Upload verified package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gouno-ui-package-${{ github.sha }}
          path: package-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30

      - name: Publish static Showcase to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: showcase/dist
          force_orphan: true
          enable_jekyll: false
