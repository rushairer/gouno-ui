name: Editor Fixture Notification Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Migrate editor notices
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('showcase/demos/products/blog-admin/post-editor.tsx'),
              Path('showcase/demos/products/blog-admin/page-editor.tsx'),
          ]
          for path in files:
              source = path.read_text()
              import_anchor = 'import { FixtureDock } from "../../../components/fixture-dock";\n'
              import_line = 'import { FixtureNotification } from "./fixture-notification";\n'
              if import_line not in source:
                  if import_anchor not in source:
                      raise SystemExit(f'{path}: FixtureDock import anchor missing')
                  source = source.replace(import_anchor, import_anchor + import_line, 1)

              if path.name == 'post-editor.tsx':
                  old = '''      {notice ? (\n        <Alert type="success" showIcon title={notice} closable={{ onClose: () => setNotice(null) }} />\n      ) : null}\n'''
              else:
                  old = '      {notice ? <Alert type="success" showIcon title={notice} closable={{ onClose: () => setNotice(null) }} /> : null}\n'
              new = '      <FixtureNotification notice={notice} onConsumed={() => setNotice(null)} />\n'
              if source.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one transient notice Alert, found {source.count(old)}')
              source = source.replace(old, new, 1)
              path.write_text(source)
          PY

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/demos/products/blog-admin/post-editor.tsx showcase/demos/products/blog-admin/page-editor.tsx
          git commit -m "fix(showcase): route editor notices through Notification"
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
