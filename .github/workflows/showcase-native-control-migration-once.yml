name: Showcase Native Control Migration Once

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Migrate native controls to canonical semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: {label}: expected 1 match, found {count}')
              path.write_text(source.replace(old, new, 1))

          # Dashboard: navigation is navigation, not a button action.
          dashboard = Path('showcase/demos/products/blog-admin/dashboard.tsx')
          replace_once(
              dashboard,
              '''  return (\n    <button type="button" className="block h-full w-full text-left" onClick={() => onNavigate(route)}>\n      {content}\n    </button>\n  );''',
              '''  return (\n    <a\n      href={route}\n      className="block h-full w-full text-left"\n      onClick={(event) => {\n        event.preventDefault();\n        onNavigate(route);\n      }}\n    >\n      {content}\n    </a>\n  );''',
              'metric navigation wrapper',
          )
          replace_once(
              dashboard,
              '''                    <button\n                      key={alert.id}\n                      type="button"\n                      className="flex w-full items-start justify-between gap-4 p-4 text-left transition-colors hover:bg-muted/40 sm:p-6"\n                      onClick={() => navigate(alert.destination)}\n                    >''',
              '''                    <a\n                      key={alert.id}\n                      href={alert.destination}\n                      className="flex w-full items-start justify-between gap-4 p-4 text-left transition-colors hover:bg-muted/40 sm:p-6"\n                      onClick={(event) => {\n                        event.preventDefault();\n                        navigate(alert.destination);\n                      }}\n                    >''',
              'AI alert navigation row open',
          )
          replace_once(dashboard, '                    </button>\n                  );\n                })}', '                    </a>\n                  );\n                })}', 'AI alert navigation row close')

          # Media blocked references are links to product routes.
          media = Path('showcase/demos/products/blog-admin/media-library.tsx')
          replace_once(
              media,
              '''                  <button\n                    type="button"\n                    className="text-left font-medium text-primary underline-offset-4 hover:underline"\n                    onClick={() => setFeedback({ type: "info", text: `将进入 /admin/posts/${reference.postId}/edit（Showcase 模拟）。` })}\n                  >\n                    {reference.title}\n                  </button>''',
              '''                  <a\n                    href={`/admin/posts/${reference.postId}/edit`}\n                    className="font-medium text-primary underline-offset-4 hover:underline"\n                    onClick={(event) => {\n                      event.preventDefault();\n                      setFeedback({ type: "info", text: `将进入 /admin/posts/${reference.postId}/edit（Showcase 模拟）。` });\n                    }}\n                  >\n                    {reference.title}\n                  </a>''',
              'blocked reference navigation',
          )

          # Editors: selectable suggestions/history use the same ChoiceButton owner as Blog.
          for name in ['post-editor.tsx', 'page-editor.tsx']:
              path = Path('showcase/demos/products/blog-admin') / name
              source = path.read_text()
              if '  ChoiceButton,\n' not in source:
                  anchor = '  Card,\n'
                  if anchor not in source:
                      raise SystemExit(f'{path}: Card import anchor missing')
                  source = source.replace(anchor, anchor + '  ChoiceButton,\n', 1)
              native_count = source.count('<button')
              if native_count == 0:
                  raise SystemExit(f'{path}: no native buttons found to migrate')
              source = source.replace('<button', '<ChoiceButton').replace('</button>', '</ChoiceButton>')
              path.write_text(source)
              print(f'{path}: migrated {native_count} native buttons')

          # Workflow/Agent master lists are selectable actions: canonical Button owns them.
          records = Path('showcase/demos/products/blog-admin/ai/operations/automation-records.tsx')
          source = records.read_text()
          native_count = source.count('<button')
          if native_count != 3:
              raise SystemExit(f'{records}: expected 3 native list buttons, found {native_count}')
          source = source.replace('<button', '<Button variant="ghost"').replace('</button>', '</Button>')
          records.write_text(source)

          # Overview task cards match the real product: Card owns the surface, Button owns the click target.
          overview = Path('showcase/demos/products/blog-admin/ai/operations/overview-inbox.tsx')
          source = overview.read_text()
          card_cases = [
              (
                  '<button type="button" className="text-left" onClick={() => onNavigate("inbox")}>\n          <Card padding="base" interactive className="h-full">',
                  '<Card padding="base" interactive className="relative h-full">',
                  '待审批变更',
                  'ShieldCheck',
              ),
              (
                  '<button type="button" className="text-left" onClick={() => onNavigate("inbox")}>\n          <Card padding="base" interactive className="h-full">',
                  '<Card padding="base" interactive className="relative h-full">',
                  '内容建议',
                  'Lightbulb',
              ),
              (
                  '<button type="button" className="text-left" onClick={() => onNavigate("inbox")}>\n          <Card padding="base" interactive className="h-full">',
                  '<Card padding="base" interactive className="relative h-full">',
                  '图片任务',
                  'Sparkles',
              ),
          ]
          # The three source openings are identical; migrate in document order and inject overlay buttons before Card close.
          for _, new_open, label, _ in card_cases:
              old_open = '<button type="button" className="text-left" onClick={() => onNavigate("inbox")}>\n          <Card padding="base" interactive className="h-full">'
              if old_open not in source:
                  raise SystemExit(f'{overview}: {label}: source wrapper missing')
              source = source.replace(old_open, new_open, 1)
              marker = '            <Text size="xs" tone="muted">'
              start = source.find(new_open)
              text_start = source.find(marker, start)
              close = source.find('            </Text>\n          </Card>\n        </button>', text_start)
              if close < 0:
                  raise SystemExit(f'{overview}: {label}: close marker missing')
              close += len('            </Text>')
              overlay = f'''\n          <Button\n            variant="ghost"\n            aria-label="查看{label}"\n            className="absolute inset-0 z-10 h-auto rounded-lg p-0 hover:bg-transparent"\n            onClick={{() => onNavigate("inbox")}}\n          />'''
              source = source[:close] + overlay + source[close:]
              source = source.replace('          </Card>\n        </button>', '          </Card>', 1)

          # Remaining selectors are non-navigation list choices/actions.
          native_count = source.count('<button')
          if native_count != 2:
              raise SystemExit(f'{overview}: expected 2 remaining native list buttons, found {native_count}')
          source = source.replace('<button', '<Button variant="ghost"').replace('</button>', '</Button>')
          overview.write_text(source)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify parity contract and typecheck
        run: npm test -- tests/blog-admin-showcase-parity.test.ts && npm run typecheck

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/demos/products/blog-admin/dashboard.tsx showcase/demos/products/blog-admin/media-library.tsx showcase/demos/products/blog-admin/post-editor.tsx showcase/demos/products/blog-admin/page-editor.tsx showcase/demos/products/blog-admin/ai/operations/automation-records.tsx showcase/demos/products/blog-admin/ai/operations/overview-inbox.tsx
          git commit -m "fix(showcase): remove native Blog Admin controls"
          git pull --rebase origin ${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
