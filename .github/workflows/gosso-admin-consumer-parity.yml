name: Gosso Admin Consumer Parity

on:
  pull_request:
    paths:
      - "src/**"
      - "showcase/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/gosso-admin-consumer-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "showcase/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/gosso-admin-consumer-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gosso-admin-consumer-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Candidate Gouno UI ↔ current Gosso Admin consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current Gosso Admin main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rushairer/gosso-admin
          ref: main
          path: consumer-gosso-admin

      - name: Checkout candidate Gouno UI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: consumer-gosso-admin/upstream-gouno-ui

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            consumer-gosso-admin/gosso-admin-frontend/package-lock.json
            consumer-gosso-admin/upstream-gouno-ui/package-lock.json

      - name: Install Gosso Admin dependencies
        working-directory: consumer-gosso-admin/gosso-admin-frontend
        run: npm ci

      - name: Install candidate Gouno UI dependencies
        working-directory: consumer-gosso-admin/upstream-gouno-ui
        run: npm ci

      - name: Install canonical Gosso parity runner
        working-directory: consumer-gosso-admin/gosso-admin-frontend/e2e
        run: |
          npm install --package-lock=false
          npx playwright install --with-deps chromium

      - name: Run canonical Gosso parity harness
        working-directory: consumer-gosso-admin/gosso-admin-frontend/e2e
        run: npx playwright test --config=showcase-parity.config.mjs

      - name: Upload paired consumer parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gouno-ui-gosso-admin-consumer-parity-${{ github.run_id }}
          path: |
            consumer-gosso-admin/gosso-admin-frontend/playwright-report-showcase-parity
            consumer-gosso-admin/gosso-admin-frontend/test-results/showcase-parity
          if-no-files-found: ignore
          retention-days: 14
