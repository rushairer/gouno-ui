name: Temporary Public Parity Diagnose

on:
  push:
    branches:
      - hardening/blog-public-account-parity

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/blog-public-account-parity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Tests
        continue-on-error: true
        run: npm test
      - name: Package build
        continue-on-error: true
        run: npm run build
      - name: Showcase build
        continue-on-error: true
        run: npm run showcase:build
      - name: Package contract
        continue-on-error: true
        run: npm run package:check
      - name: Remove temporary workflow
        if: always()
        run: |
          rm .github/workflows/tmp-public-parity-diagnose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): remove temporary public parity diagnostic"
          git push origin HEAD:hardening/blog-public-account-parity
