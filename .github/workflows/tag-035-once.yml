name: Tag 0.3.5 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tag-035-once.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify and push release tag
        shell: bash
        env:
          RELEASE_SHA: 7824d33610acf67db294703bd7ee1edd40232835
          RELEASE_TAG: v0.3.5
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD^)" = "$RELEASE_SHA"
          git show "$RELEASE_SHA:package.json" | grep -F '"version": "0.3.5"'
          git show "$RELEASE_SHA:CHANGELOG.md" | grep -F '## [0.3.5]'
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$RELEASE_TAG")" = "$RELEASE_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "@gouno/ui 0.3.5"
          git push origin "$RELEASE_TAG"
