name: Certify Core Splitter 6B2 Governance

on:
  push:
    branches: [docs/core-splitter-6b2-governance]
    paths:
      - .github/workflows/certify-core-splitter-6b2.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/core-splitter-6b2-governance
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Apply governance records
        run: python3 .github/scripts/apply-core-splitter-6b2-governance.py
      - name: Verify governance against package
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
          npm run showcase:build
      - name: Commit certified governance
        run: |
          rm .github/scripts/apply-core-splitter-6b2-governance.py
          rm .github/workflows/certify-core-splitter-6b2.yml
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add -A
          git commit -m "docs(core): record Splitter 6B2 certification"
          git push origin HEAD:docs/core-splitter-6b2-governance
