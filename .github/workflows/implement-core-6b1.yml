name: Implement Core 6B1

on:
  push:
    branches: [feat/core-avatar-grid-6b1]
    paths:
      - .github/workflows/implement-core-6b1.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/core-avatar-grid-6b1
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Apply 6B1 hardening
        shell: bash
        run: |
          python3 .github/scripts/apply-core-6b1.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("showcase/demos/core/surface-review-5a.tsx")
          lines = path.read_text(encoding="utf-8").splitlines()
          title_index = next(
              i for i, line in enumerate(lines)
              if 'title: "AvatarImage / AvatarFallback / AvatarBadge API"' in line
          )
          title_indent = lines[title_index][: len(lines[title_index]) - len(lines[title_index].lstrip())]
          section_indent = title_indent[:-2]
          lines[title_index] = f'{title_indent}title: "AvatarImage API",'

          fallback_row = next(line for line in lines[title_index:] if 'name: "AvatarFallback"' in line)
          badge_row = next(line for line in lines[title_index:] if 'name: "AvatarBadge"' in line)
          count_row = next(line for line in lines[title_index:] if 'name: "AvatarGroupCount"' in line)
          lines.remove(fallback_row)
          lines.remove(badge_row)
          lines.remove(count_row)

          end_index = next(
              i for i in range(title_index + 1, len(lines))
              if lines[i] == f"{section_indent}}},"
          )
          row_indent = title_indent + "  "
          extra = [
              f"{section_indent}{{",
              f'{title_indent}title: "AvatarFallback API",',
              f"{title_indent}rows: [",
              fallback_row,
              f"{title_indent}],",
              f"{section_indent}}},",
              f"{section_indent}{{",
              f'{title_indent}title: "AvatarBadge / AvatarGroupCount API",',
              f"{title_indent}rows: [",
              badge_row,
              count_row,
              f"{title_indent}],",
              f"{section_indent}}},",
          ]
          lines[end_index + 1:end_index + 1] = extra
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Verify 6B1
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
          npm run showcase:build
      - name: Commit verified implementation
        run: |
          rm .github/workflows/implement-core-6b1.yml
          rm .github/scripts/apply-core-6b1.py
          git config user.name Aben
          git config user.email 5195693+rushairer@users.noreply.github.com
          git add -A
          git commit -m "feat(core): harden Avatar and Grid"
          git push origin HEAD:feat/core-avatar-grid-6b1
