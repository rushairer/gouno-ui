name: Implement Core 6B1

on:
  push:
    branches: [feat/core-avatar-grid-6b1]
    paths:
      - .github/workflows/implement-core-6b1.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/core-avatar-grid-6b1
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Apply 6B1 hardening
        shell: bash
        run: |
          python3 .github/scripts/apply-core-6b1.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("showcase/demos/core/surface-review-5a.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''      {
                title: "AvatarImage / AvatarFallback / AvatarBadge API",
                rows: [
                  { name: "AvatarImage", description: "图片层；支持 src/alt 及标准 image primitive 属性，ref 指向真实 img。", type: "AvatarImageProps" },
                  { name: "AvatarFallback", description: "图片不可用时的文字/图标回退；支持 delayMs。", type: "AvatarFallbackProps" },
                  { name: "AvatarBadge", description: "头像角标视觉槽；业务状态与可访问名称由调用方提供。", type: "AvatarBadgeProps" },
                  { name: "AvatarGroupCount", description: "手动组合头像组计数时使用；AvatarGroup.max 会自动使用同一视觉槽。", type: "AvatarGroupCountProps" },
                ],
              },
          '''
          # Match the actual source indentation while preserving the older two section names.
          old = old.replace("              ", "      ")
          new = '''      {
                title: "AvatarImage API",
                rows: [
                  { name: "AvatarImage", description: "图片层；支持 src/alt 及标准 image primitive 属性，ref 指向真实 img。", type: "AvatarImageProps" },
                ],
              },
              {
                title: "AvatarFallback API",
                rows: [
                  { name: "AvatarFallback", description: "图片不可用时的文字/图标回退；支持 delayMs。", type: "AvatarFallbackProps" },
                ],
              },
              {
                title: "AvatarBadge / AvatarGroupCount API",
                rows: [
                  { name: "AvatarBadge", description: "头像角标视觉槽；业务状态与可访问名称由调用方提供。", type: "AvatarBadgeProps" },
                  { name: "AvatarGroupCount", description: "手动组合头像组计数时使用；AvatarGroup.max 会自动使用同一视觉槽。", type: "AvatarGroupCountProps" },
                ],
              },
          '''.replace("              ", "      ")
          if old not in text:
              raise SystemExit("Avatar compound API section marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Verify 6B1
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
          npm run showcase:build
      - name: Commit verified implementation
        run: |
          rm .github/workflows/implement-core-6b1.yml
          rm .github/scripts/apply-core-6b1.py
          git config user.name Aben
          git config user.email 5195693+rushairer@users.noreply.github.com
          git add -A
          git commit -m "feat(core): harden Avatar and Grid"
          git push origin HEAD:feat/core-avatar-grid-6b1
