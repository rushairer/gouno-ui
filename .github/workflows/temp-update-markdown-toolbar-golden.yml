name: Temp Update Markdown Toolbar Golden

on:
  push:
    branches: [markdown-editor-adaptive-toolbar]
    paths:
      - ".github/workflows/temp-update-markdown-toolbar-golden.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: markdown-editor-adaptive-toolbar

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install isolated Playwright runtime
        run: |
          PLAYWRIGHT_VERSION=1.55.0
          npm install --no-save --ignore-scripts @playwright/test@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium

      - name: Update Post Editor golden only
        run: |
          npx playwright test \
            --config=showcase/e2e/canonical-visual-golden.config.mjs \
            --grep="blog-admin-post-editor-desktop-light" \
            --update-snapshots

      - name: Commit intended golden
        run: |
          GOLDEN=showcase/e2e/canonical-visual-golden.pw.mjs-snapshots/blog-admin-post-editor-desktop-light.png
          git status --short
          test -f "$GOLDEN"
          CHANGED=$(git status --short | awk '{print $2}')
          test "$CHANGED" = "$GOLDEN"
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git add "$GOLDEN"
          git commit -m "test(showcase): update Post Editor adaptive toolbar golden"
          git push origin HEAD:markdown-editor-adaptive-toolbar
