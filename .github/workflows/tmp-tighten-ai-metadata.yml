name: Temporary tighten AI metadata semantics

on:
  push:
    branches:
      - feat/ai-pattern-showcase-post-metadata

permissions:
  contents: write

jobs:
  tighten:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-pattern-showcase-post-metadata
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/tmp-tighten-ai-metadata.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run focused tests
        run: npx vitest run --environment jsdom tests/pattern-ai-suggestions.test.tsx tests/product-blog-admin-post-editor-metadata-ai.test.tsx

      - name: Commit semantic tightening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/demos/products/blog-admin/post-editor.tsx showcase/demos/patterns/examples/ai-suggestion-review.tsx tests/product-blog-admin-post-editor-metadata-ai.test.tsx
          git commit -m "fix: keep AI review changes explicit"
          git push origin HEAD:feat/ai-pattern-showcase-post-metadata
