name: Temporary tighten AI metadata semantics

on:
  push:
    branches:
      - feat/ai-pattern-showcase-post-metadata

permissions:
  contents: write

jobs:
  tighten:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-pattern-showcase-post-metadata
          fetch-depth: 0

      - name: Tighten reviewed-change semantics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          post = Path('showcase/demos/products/blog-admin/post-editor.tsx')
          text = post.read_text()
          old = 'const postTaxonomyTags = ["AI", "Agent", "可观测性", "AI 治理", "自动化"] as const;'
          new = 'const postTaxonomyTags = ["AI 治理", "自动化"] as const;'
          if old not in text:
              raise SystemExit('taxonomy tag anchor missing')
          post.write_text(text.replace(old, new, 1))

          review = Path('showcase/demos/patterns/examples/ai-suggestion-review.tsx')
          text = review.read_text()
          text = text.replace(
              '  const [appliedKeys, setAppliedKeys] = useState<string[]>([]);',
              '  const [appliedKeys, setAppliedKeys] = useState<string[]>([]);\n  const [visible, setVisible] = useState(true);',
              1,
          )
          text = text.replace(
              '  return (\n    <div className="flex flex-col gap-4">',
              '''  if (!visible) {
    return (
      <div className="flex min-h-48 items-center justify-center rounded-lg border border-dashed bg-muted/10">
        <button
          type="button"
          className="rounded-md border px-3 py-2 text-sm font-medium"
          onClick={() => {
            setSelectedKeys(suggestions.map((item) => item.key));
            setVisible(true);
          }}
        >
          重新打开 AI 建议
        </button>
      </div>
    );
  }

  return (
    <div className="flex flex-col gap-4">''',
              1,
          )
          text = text.replace(
              '        onCancel={() => setSelectedKeys([])}',
              '        onCancel={() => setVisible(false)}',
              1,
          )
          review.write_text(text)

          test = Path('tests/product-blog-admin-post-editor-metadata-ai.test.tsx')
          text = test.read_text()
          text = text.replace(
              '    expect((screen.getByLabelText("标签") as HTMLInputElement).value).toContain("AI 治理");\n    expect((screen.getByLabelText("标签") as HTMLInputElement).value).toContain("自动化");',
              '    expect((screen.getByLabelText("标签") as HTMLInputElement).value).toBe("AI 治理, 自动化");',
              1,
          )
          test.write_text(text)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --environment jsdom tests/pattern-ai-suggestions.test.tsx tests/product-blog-admin-post-editor-metadata-ai.test.tsx

      - name: Commit semantic tightening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/demos/products/blog-admin/post-editor.tsx showcase/demos/patterns/examples/ai-suggestion-review.tsx tests/product-blog-admin-post-editor-metadata-ai.test.tsx
          git commit -m "fix: keep AI review changes explicit"
          git push origin HEAD:feat/ai-pattern-showcase-post-metadata
