name: Recover 0.3.5 release once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-035-recovery-once.yml

permissions:
  actions: write
  contents: write

jobs:
  recover:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify clean release source
        shell: bash
        env:
          TARGET_SHA: 240797dee73266d3e388f28cf7873663086db03c
          RELEASE_TAG: v0.3.5
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD^)" = "$TARGET_SHA"
          git show "$TARGET_SHA:.github/workflows/release.yml" | grep -Fq 'workflow_dispatch:'
          git show "$TARGET_SHA:package.json" | grep -F '"version": "0.3.5"'
          git show "$TARGET_SHA:CHANGELOG.md" | grep -F '## [0.3.5]'
          for helper in tag-035-once.yml tag-035-macos-once.yml dispatch-release-035-once.yml; do
            if git cat-file -e "$TARGET_SHA:.github/workflows/$helper" 2>/dev/null; then
              echo "Temporary helper still exists in clean release source: $helper" >&2
              exit 1
            fi
          done

      - name: Move pre-publication tag to clean release source
        shell: bash
        env:
          TARGET_SHA: 240797dee73266d3e388f28cf7873663086db03c
          RELEASE_TAG: v0.3.5
        run: |
          set -euo pipefail
          git fetch origin --tags
          CURRENT_SHA="$(git rev-list -n1 "$RELEASE_TAG")"
          if [ "$CURRENT_SHA" != "$TARGET_SHA" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -d "$RELEASE_TAG"
            git tag -a "$RELEASE_TAG" "$TARGET_SHA" -m "@gouno/ui 0.3.5"
            git push --force origin "refs/tags/$RELEASE_TAG"
          fi
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$TARGET_SHA"

      - name: Dispatch canonical npm release workflow on tag ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v0.3.5 -f tag=v0.3.5
