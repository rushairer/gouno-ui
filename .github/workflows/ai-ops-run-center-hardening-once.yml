name: AI Ops Run Center Hardening Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-ops-run-center-hardening-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Normalize Agent Run Center to the canonical master/detail anatomy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('showcase/demos/products/blog-admin/ai/operations/automation-records.tsx')
          text = path.read_text()
          old = '''        <div className="grid gap-6 xl:grid-cols-[19rem_minmax(0,1fr)]">
          <section className="overflow-hidden rounded-lg border bg-background" aria-label="Agent Runs">
            <div className="border-b px-[18px] py-4"><strong className="text-sm">Agent Runs</strong><Text size="xs" tone="muted">{fixture.agentRuns.length} 条运行记录</Text></div>
            <div>{fixture.agentRuns.map((run) => ('''
          new = '''        <div data-slot="ops-master-detail" className="grid min-w-0 items-stretch gap-6 xl:grid-cols-[19rem_minmax(0,1fr)]">
          <section data-slot="ops-rail" className="flex min-h-0 min-w-0 flex-col overflow-hidden rounded-lg border bg-background" aria-label="Agent Runs">
            <div className="shrink-0 border-b px-[18px] py-4"><strong className="text-sm">Agent Runs</strong><Text size="xs" tone="muted">{fixture.agentRuns.length} 条运行记录</Text></div>
            <div data-slot="ops-rail-body" className="min-h-0 flex-1 overflow-y-auto overscroll-contain">{fixture.agentRuns.map((run) => ('''
          if text.count(old) != 1:
              raise SystemExit(f'expected one Agent Run Center anatomy, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          npx prettier --write showcase/demos/products/blog-admin/ai/operations/automation-records.tsx
      - name: Verify canonical source
        run: |
          npm run typecheck
          npx vitest run tests/product-blog-admin-ai-operations-automation-records.test.tsx tests/product-blog-admin-ai-operations-panel-lead.test.ts
          npm run showcase:build
      - name: Commit and retire helper
        shell: bash
        run: |
          git rm .github/workflows/ai-ops-run-center-hardening-once.yml
          git add showcase/demos/products/blog-admin/ai/operations/automation-records.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai-ops): canonicalize agent run center anatomy"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Re-run permanent gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref main
          gh workflow run blog-consumer-parity.yml --ref main
          gh workflow run canonical-visual-golden.yml --ref main
          gh workflow run showcase-pages.yml --ref main
