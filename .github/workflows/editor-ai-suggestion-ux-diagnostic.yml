name: Temporary editor AI suggestion UX diagnostic

on:
  push:
    branches:
      - feat/editor-ai-suggestion-ux
    paths:
      - .github/workflows/editor-ai-suggestion-ux-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/editor-ai-suggestion-ux

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Reuse patch script from staging workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/editor-ai-suggestion-ux-patch.yml').read_text().splitlines()
          start = source.index('      - name: Apply editor UX changes')
          stop = source.index('      - name: Install dependencies')
          block = source[start:stop]
          run_index = block.index('        run: |')
          shell = []
          for line in block[run_index + 1:]:
              shell.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-editor-ai-ux.sh').write_text('\n'.join(shell) + '\n')
          PY
          bash /tmp/apply-editor-ai-ux.sh
          sed -i 's/<TooltipContent side="right" className="max-w-80">/<TooltipContent className="max-w-80">/' showcase/demos/products/blog-admin/post-editor.tsx
          python3 <<'PY'
          from pathlib import Path

          pattern = Path('src/patterns/ai-suggestions.tsx')
          text = pattern.read_text()
          text = text.replace(
              'import { Button, Checkbox, Radio } from "../core";',
              'import { Button } from "../core/button";\nimport { Checkbox, Radio } from "../core/selection-controls";',
          )
          pattern.write_text(text)

          architecture = Path('tests/architecture-boundaries.test.ts')
          text = architecture.read_text()
          text = text.replace(
              '["BulkActionBar", "DocumentEditorShell", "MarkdownEditor"]',
              '["AISuggestionPicker", "AISuggestionReview", "BulkActionBar", "DocumentEditorShell", "MarkdownEditor"]',
          )
          architecture.write_text(text)

          post_test = Path('tests/product-blog-admin-post-editor.test.tsx')
          text = post_test.read_text()
          text = text.replace(
              '/跳转到 当 Agent 从一次性生成走向长期自动化/',
              '/跳转到 为什么现在要谈可观测性/',
          )
          text = text.replace(
              'expect(longOutlineItem.querySelector("span")?.className).toContain("truncate");',
              'expect(longOutlineItem.querySelector(".truncate")).toBeTruthy();',
          )
          post_test.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify source and tests
        run: |
          npm run lint:microcopy
          npm run lint:parity
          npm run typecheck
          npm test
          npm run build
          npm run showcase:build
          npm run package:check

      - name: Commit verified editor UX changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/patterns/ai-suggestions.tsx src/patterns/index.ts \
            showcase/demos/products/blog-admin/post-editor.tsx \
            showcase/demos/products/blog-admin/page-editor.tsx \
            tests/architecture-boundaries.test.ts \
            tests/pattern-ai-suggestions.test.tsx \
            tests/product-blog-admin-post-editor.test.tsx \
            tests/product-blog-admin-page-editor.test.tsx \
            docs/api-conformance.md docs/abstraction-register.md
          git commit -m "feat(blog-admin): unify editor AI suggestion UX"
          git push origin HEAD:feat/editor-ai-suggestion-ux
