name: Finalize Core 6B1 governance

on:
  push:
    branches:
      - docs/core-avatar-grid-6b1-governance
    paths:
      - .github/workflows/finalize-core-6b1-governance.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/core-avatar-grid-6b1-governance
          fetch-depth: 0
      - name: Append verified governance records
        run: python3 .github/scripts/finalize-core-6b1-governance.py
      - name: Commit governance and remove one-time helpers
        run: |
          rm .github/workflows/finalize-core-6b1-governance.yml
          rm .github/scripts/finalize-core-6b1-governance.py
          git config user.name Aben
          git config user.email 5195693+rushairer@users.noreply.github.com
          git add -A
          git commit -m "docs(core): record Avatar Grid 6B1 certification"
          git push origin HEAD:docs/core-avatar-grid-6b1-governance
