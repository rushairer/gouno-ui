          npm run lint:microcopy
          npm run lint:parity
          npm run typecheck
          npm test
          npm run build
          npm run showcase:build
          npm run package:check

      - name: Regenerate affected visual golden snapshots
        run: |
          PLAYWRIGHT_VERSION=1.55.0
          npm install --no-save --ignore-scripts @playwright/test@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium
          npx playwright test --config=showcase/e2e/canonical-visual-golden.config.mjs --update-snapshots
          git restore package.json package-lock.json

      - name: Commit verified editor UX changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/editor-ai-suggestion-ux-patch.yml
          git add src/patterns/ai-suggestions.tsx src/patterns/index.ts \
            showcase/demos/products/blog-admin/post-editor.tsx \
