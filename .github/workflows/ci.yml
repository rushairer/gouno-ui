name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Showcase microcopy and action grammar
        run: npm run lint:microcopy

      - name: Verify reciprocal consumer parity maintenance contract
        run: npm run lint:parity

      - name: Verify Foundation integrity progress ledger
        run: npm run lint:foundation

      - name: Verify Canonical Showcase audit contract
        run: npm run lint:canonical-audit

      - name: Verify CSA-5 Canonical freeze matrix
        run: npm run lint:canonical-freeze

      - name: Verify JSX source hygiene
        run: npm run lint:source-hygiene

      - name: Typecheck package and Showcase
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Build Showcase
        run: npm run showcase:build

      - name: Verify publication surface
        run: npm run package:check
