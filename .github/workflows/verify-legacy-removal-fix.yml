name: Verify Legacy Removal Fix

on:
  push:
    branches:
      - fix/legacy-source-removal-invariants

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/legacy-source-removal-invariants
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm run showcase:build
