name: Create v0.4.8 release tag

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  tag:
    if: github.repository == 'rushairer/gouno-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag verified 0.4.8 commit
        shell: bash
        env:
          TAG: v0.4.8
          TARGET_SHA: b9eb02de08f42bf081180bf83b28c34fa30a5a89
          EXPECTED_VERSION: 0.4.8
        run: |
          set -euo pipefail
          git fetch origin --tags
          git cat-file -e "${TARGET_SHA}^{commit}"
          PACKAGE_VERSION="$(git show "${TARGET_SHA}:package.json" | node --input-type=module -e "let input=''; for await (const chunk of process.stdin) input += chunk; process.stdout.write(JSON.parse(input).version)")"
          if [ "$PACKAGE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Target $TARGET_SHA carries package version $PACKAGE_VERSION, expected $EXPECTED_VERSION." >&2
            exit 1
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_TARGET="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_TARGET" != "$TARGET_SHA" ]; then
              echo "$TAG points to $TAG_TARGET, expected $TARGET_SHA." >&2
              exit 1
            fi
            echo "$TAG already exists at the verified target."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "@gouno/ui $EXPECTED_VERSION"
            git push origin "$TAG"
          fi

      - name: Dispatch canonical npm release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.4.8
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f tag="$TAG"
