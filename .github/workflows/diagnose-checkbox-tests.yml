name: Diagnose checkbox tests

on:
  push:
    branches:
      - ui/showcase-parity-hardening-20260913

permissions:
  contents: write

concurrency:
  group: diagnose-checkbox-tests
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ui/showcase-parity-hardening-20260913

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture failing tests
        shell: bash
        run: |
          set +e
          npm test > ci-test-failure.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            printf 'npm test passed\n' > ci-test-failure.txt
          fi

      - name: Remove one-shot diagnostic workflow
        run: rm .github/workflows/diagnose-checkbox-tests.yml

      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): capture checkbox test diagnostic"
          git push origin HEAD:ui/showcase-parity-hardening-20260913
