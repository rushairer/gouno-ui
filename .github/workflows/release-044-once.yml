name: Prepare and publish 0.4.4 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-044-once.yml

permissions:
  actions: write
  contents: write

jobs:
  release-once:
    if: "${{ github.event.head_commit.message == 'ci: trigger gouno ui 0.4.4 release' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          CURRENT_VERSION="$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('package.json', 'utf8')); process.stdout.write(pkg.version);")"
          test "$CURRENT_VERSION" = "0.4.3"
          if git rev-parse -q --verify "refs/tags/v0.4.4" >/dev/null; then
            echo "v0.4.4 already exists; refusing to prepare the release twice." >&2
            exit 1
          fi

      - name: Prepare 0.4.4 metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.4.4 --no-git-tag-version
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'CHANGELOG.md';
          const source = await readFile(path, 'utf8');
          const marker = '## [Unreleased]\n';
          if (!source.includes(marker)) throw new Error('CHANGELOG.md is missing the Unreleased heading');
          if (source.includes('## [0.4.4]')) throw new Error('CHANGELOG.md already contains 0.4.4');
          const entry = `${marker}\n## [0.4.4] - 2026-09-17\n\n### Added\n- Canonical Blog Admin AI Operations Showcase grounded in the real Blog Admin workflow, Run, approval, interaction, media and evidence capabilities.\n- Product-level Workflow master-detail, Decision Workbench and Run Evidence compositions with responsive and visual-golden coverage.\n\n### Changed\n- AI Settings Showcase now groups Agent, Skill, Provider, Embedding and Connector governance around explicit product semantics instead of flat configuration fields.\n- Workflow automation surfaces now use a consistent list-item anatomy, operational summary hierarchy and source-grounded Fixture scenarios.\n\n### Fixed\n- Recent Workflow Run rows preserve desktop column semantics inside Gouno Button composition and collapse cleanly on narrow viewports.\n- Workflow selection, filtered Run detail and failed/Dry-run evidence stay synchronized across the AI Operations workspace.\n`;
          await writeFile(path, source.replace(marker, entry));
          NODE

      - name: Commit release metadata to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git diff --cached --check
          git commit -m "chore: prepare gouno ui 0.4.4 release"
          git push origin HEAD:main

      - name: Tag clean release commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v0.4.4 HEAD -m "@gouno/ui 0.4.4"
          git push origin refs/tags/v0.4.4
          test "$(node --input-type=module -e "import { readFile } from 'node:fs/promises'; const pkg = JSON.parse(await readFile('package.json', 'utf8')); process.stdout.write(pkg.version);")" = "0.4.4"
          grep -Fq '## [0.4.4]' CHANGELOG.md

      - name: Dispatch canonical npm release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v0.4.4 -f tag=v0.4.4
