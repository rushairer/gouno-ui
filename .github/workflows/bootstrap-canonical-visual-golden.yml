name: Bootstrap Canonical Visual Golden

on:
  push:
    branches: [canonical-visual-golden-smoke]
    paths:
      - "showcase/e2e/canonical-visual-golden.pw.mjs"
      - "showcase/e2e/canonical-visual-golden.config.mjs"
      - ".github/workflows/bootstrap-canonical-visual-golden.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-canonical-visual-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install isolated Playwright runtime
        run: |
          PLAYWRIGHT_VERSION=1.55.0
          npm install --no-save --ignore-scripts @playwright/test@${PLAYWRIGHT_VERSION}
          npx playwright install --with-deps chromium

      - name: Generate canonical visual baselines
        run: npx playwright test --config=showcase/e2e/canonical-visual-golden.config.mjs --update-snapshots

      - name: Verify generated baselines
        run: npx playwright test --config=showcase/e2e/canonical-visual-golden.config.mjs

      - name: Commit baseline images
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showcase/e2e/canonical-visual-golden.pw.mjs-snapshots
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git commit -m "test: establish canonical visual golden baselines"
          git push origin HEAD:"${BRANCH}"
