name: AI Ops Run Center Contract Finalize Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-ops-run-center-contract-finalize-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Seal canonical Agent Run Center anatomy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("showcase/demos/products/blog-admin/ai/operations/automation-records.tsx")
          text = path.read_text()

          grid_pattern = re.compile(
              r'(\) : \(\n\s*)<div className="grid gap-6 xl:grid-cols-\[19rem_minmax\(0,1fr\)\]">\n\s*<section\n\s*className="overflow-hidden rounded-lg border bg-background"\n\s*aria-label="Agent Runs"\n\s*>'
          )
          replacement = (
              r'\1<div\n'
              r'          data-slot="ops-master-detail"\n'
              r'          className="grid min-w-0 items-stretch gap-6 xl:grid-cols-[19rem_minmax(0,1fr)]"\n'
              r'        >\n'
              r'          <section\n'
              r'            data-slot="ops-rail"\n'
              r'            className="flex min-h-0 min-w-0 flex-col overflow-hidden rounded-lg border bg-background"\n'
              r'            aria-label="Agent Runs"\n'
              r'          >'
          )
          text, grid_count = grid_pattern.subn(replacement, text, count=1)
          if grid_count != 1:
              raise SystemExit(f"expected one Agent Run Center grid, got {grid_count}")

          body_pattern = re.compile(
              r'(\s*</div>\n)\s*<div>\n\s*\{fixture\.agentRuns\.map\(\(run\) => \('
          )
          body_replacement = (
              r'\1            <div\n'
              r'              data-slot="ops-rail-body"\n'
              r'              className="min-h-0 flex-1 overflow-y-auto overscroll-contain"\n'
              r'            >\n'
              r'              {fixture.agentRuns.map((run) => ('
          )
          marker = 'aria-label="Agent Runs"'
          head, tail = text.rsplit(marker, 1)
          tail, body_count = body_pattern.subn(body_replacement, tail, count=1)
          if body_count != 1:
              raise SystemExit(f"expected one Agent Run rail body, got {body_count}")
          text = head + marker + tail
          path.write_text(text)
          PY

          cat > tests/product-blog-admin-ai-operations-run-center-contract.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";

          const read = (file: string) =>
            readFileSync(resolve(process.cwd(), file), "utf8");

          describe("Blog Admin AI Operations canonical run-center contract", () => {
            it("uses the canonical panel lead across all top-level AI Operations tabs", () => {
              const overviewInbox = read(
                "showcase/demos/products/blog-admin/ai/operations/overview-inbox.tsx",
              );
              const automation = read(
                "showcase/demos/products/blog-admin/ai/operations/automation-management.tsx",
              );
              const records = read(
                "showcase/demos/products/blog-admin/ai/operations/automation-records.tsx",
              );
              const panelLead = read("showcase/components/tab-panel-lead.tsx");

              expect(panelLead).toContain('data-pattern="tab-panel-lead"');
              expect(overviewInbox.match(/<TabPanelLead/g)?.length ?? 0).toBeGreaterThanOrEqual(2);
              expect(automation).toContain("<TabPanelLead");
              expect(records).toContain("<TabPanelLead");
            });

            it("keeps Workflow and Agent records on the same master/detail anatomy", () => {
              const records = read(
                "showcase/demos/products/blog-admin/ai/operations/automation-records.tsx",
              );

              expect(records.match(/data-slot="ops-master-detail"/g)?.length).toBe(2);
              expect(records.match(/data-slot="ops-rail"/g)?.length).toBe(2);
              expect(records.match(/data-slot="ops-rail-body"/g)?.length).toBe(2);
              expect(records.match(/xl:grid-cols-\[19rem_minmax\(0,1fr\)\]/g)?.length).toBe(2);
            });

            it("keeps Recent Runs on the canonical five-column responsive row", () => {
              const automation = read(
                "showcase/demos/products/blog-admin/ai/operations/automation-management.tsx",
              );
              expect(automation).toContain(
                "sm:grid-cols-[7rem_7rem_minmax(7rem,0.7fr)_6rem_minmax(0,1.5fr)]",
              );
              expect(automation).toContain("[&>span]:contents");
            });
          });
          EOF

          npx prettier --write \
            showcase/demos/products/blog-admin/ai/operations/automation-records.tsx \
            tests/product-blog-admin-ai-operations-run-center-contract.test.ts
      - name: Verify canonical source
        run: |
          npm run typecheck
          npx vitest run --environment jsdom \
            tests/product-blog-admin-ai-operations-run-center-contract.test.ts \
            tests/product-blog-admin-ai-operations-automation-records.test.tsx \
            tests/product-blog-admin-ai-operations-shell.test.tsx
          npm run showcase:build
      - name: Commit contract and retire one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Aben"
          git config user.email "5195693+rushairer@users.noreply.github.com"
          git rm -f \
            .github/workflows/ai-ops-run-center-contract-finalize-once.yml \
            .github/workflows/ai-ops-run-center-finalize-once.yml \
            .github/workflows/ai-ops-run-center-hardening-once.yml \
            .github/workflows/ai-ops-run-center-recovery-once.yml
          git add showcase/demos/products/blog-admin/ai/operations/automation-records.tsx \
            tests/product-blog-admin-ai-operations-run-center-contract.test.ts
          git commit -m "fix(ai-ops): seal canonical run center anatomy"
          git push origin HEAD:main
